name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --all-targets

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check rebuild budget and publish summary
        shell: bash
        run: |
          set +e
          cargo run --release -- --ci --json --max-rebuilds 999 > rebuild-report.json
          analyzer_status=$?
          set -e

          echo "## Cargo rebuild report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | \`$(jq -r '.status' rebuild-report.json)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Crates analyzed | $(jq -r '.crates_analyzed' rebuild-report.json) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Crates rebuilt | $(jq -r '.crates_rebuilt' rebuild-report.json) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Estimated wasted time | $(jq -r '.estimated_wasted_ms' rebuild-report.json) ms |" >> "$GITHUB_STEP_SUMMARY"

          if [ "$(jq '.crates_rebuilt' rebuild-report.json)" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Rebuilt crates" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.rebuilt[] | "- **\(.name)** \(.version): \(.likely_cause)"' rebuild-report.json >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$analyzer_status"
